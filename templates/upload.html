{% extends "base.html" %}
{% block title %}文件上传{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-cloud-upload"></i> 文件上传</h4>
            </div>
            <div class="card-body">
                {% if users %}
                <form method="POST" action="{{ url_for('upload') }}" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="user_id" class="form-label">选择用户</label>
                        <select class="form-select" id="user_id" name="user_id" required>
                            <option value="">-- 请选择用户 --</option>
                            {% for user in users %}
                            <option value="{{ user.id }}">{{ user.username }} ({{ user.email }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="file" class="form-label">选择文件</label>
                        <input type="file" class="form-control" id="file" name="file" required>
                        <div class="form-text">
                            支持的文件类型：txt, pdf, png, jpg, jpeg, gif, doc, docx, xls, xlsx, csv, zip<br>
                            最大文件大小：16 MB
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">
                        <i class="bi bi-upload"></i> 上传
                    </button>
                </form>
                {% else %}
                <div class="alert alert-info mb-0">
                    <i class="bi bi-info-circle"></i>
                    还没有注册用户。请先 <a href="{{ url_for('register') }}">注册用户</a> 后再上传文件。
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
